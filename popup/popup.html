<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FB 智能私信大师</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <img src="../assets/icon128.png" alt="Logo" class="logo-img">
        <div class="title-group">
          <h1>FB 智能私信大师</h1>
          <span class="version-tag">Pro v5.0.0</span>
        </div>
      </div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">就绪</span>
      </div>
    </header>

    <!-- Identity Banner Reminder -->
    <div class="identity-notice">
      <span class="notice-icon">💡</span>
      <span class="notice-text">请确保在 FB 中已切换至目标<b>公共主页</b>或<b>个人主页</b>身份。</span>
    </div>

    <!-- Emergency Brake Alert (Hidden by default) -->
    <div class="emergency-alert" id="emergencyAlert" style="display: none;">
      <div class="alert-title">🚨 触发风控熔断警告！</div>
      <div class="alert-desc" id="emergencyDesc">检测到 Facebook 安全验证提示，系统已自动刹车终止运行！</div>
      <button class="btn-reset-brake" id="btnResetBrake">已解决验证，解除熔断锁定</button>
    </div>

    <!-- Quick Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-value" id="statProcessed">0</span>
        <span class="stat-label">已扫留言</span>
      </div>
      <div class="stat-card">
        <span class="stat-value highlight-blue" id="statDm">0</span>
        <span class="stat-label">成功私信</span>
      </div>

      <div class="stat-card">
        <span class="stat-value highlight-red" id="statErrors">0</span>
        <span class="stat-label">异常记录</span>
      </div>
    </div>

    <!-- Live Status Box -->
    <div class="status-box">
      <div class="status-box-header">
        <span>当前运行动态</span>
        <span class="pulse-icon">●</span>
      </div>
      <div class="status-box-content" id="liveStatusContent">
        等待任务启动... 点击下方“一键启动”即可开启自动化监控。
      </div>
    </div>

    <!-- Control Buttons -->
    <div class="control-actions">
      <button class="btn btn-primary" id="btnStart">
        <span class="btn-icon">▶</span>
        <span>一键启动监控</span>
      </button>
      <button class="btn btn-warning" id="btnPause" disabled>
        <span class="btn-icon">⏸</span>
        <span>暂停任务</span>
      </button>
      <button class="btn btn-danger" id="btnStop" disabled>
        <span class="btn-icon">⏹</span>
        <span>终止运行</span>
      </button>
    </div>

    <!-- Footer Action -->
    <footer class="footer">
      <button class="btn-dashboard" id="btnOpenDashboard">
        <span>⚙️ 打开完整管理控制台 (规则/贴文/日志/导出)</span>
      </button>
    </footer>
  </div>

  <script src="../utils/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
